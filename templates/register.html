<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — AgriChain</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .touch-target { min-height: 44px; min-width: 44px; }
    :focus-visible { outline: 2px solid #047857; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased flex flex-col">

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">

      <!-- Brand -->
      <div class="flex items-center gap-2.5 justify-center mb-6">
        <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center text-white shadow-sm" aria-hidden="true">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v18m0-18C8 3 4 7 4 12c0 4 3 7 8 7m0-19c4 0 8 4 8 9 0 4-3 7-8 7M7 14l5-5 5 5"/>
          </svg>
        </div>
        <div class="text-left">
          <h1 class="text-base font-bold text-slate-900 leading-tight">AgriChain</h1>
          <p class="text-[11px] text-slate-500 leading-tight">Ketertelusuran Pangan Organik</p>
        </div>
      </div>

      <!-- Kartu daftar -->
      <div class="bg-white border border-slate-200 rounded-xl p-6 sm:p-7 shadow-sm">
        {% if error %}
        <div class="mt-4 flex items-start gap-2 rounded-lg border border-rose-300 bg-rose-50 p-3 text-sm text-rose-900" role="alert">
          <span class="w-5 h-5 rounded-full bg-rose-600 text-white text-xs font-bold flex items-center justify-center shrink-0">!</span>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/register" class="mt-5 space-y-4">
          <div>
            <label for="username" class="block text-sm font-semibold text-slate-900 mb-1">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username"
                   minlength="3" maxlength="20" pattern="[a-z0-9_]{3,20}"
                   value="{{ form.username or '' }}"
                   placeholder="contoh: budi_tani"
                   class="touch-target w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
            <p class="text-xs text-slate-600 mt-1">3–20 karakter: huruf kecil, angka, atau garis bawah.</p>
          </div>

          <div>
            <label for="name" class="block text-sm font-semibold text-slate-900 mb-1">Nama tampilan</label>
            <input type="text" id="name" name="name" required maxlength="40"
                   value="{{ form.name or '' }}"
                   placeholder="contoh: Budi Santoso"
                   class="touch-target w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-slate-900 mb-1">Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                   placeholder="minimal 8 karakter"
                   class="touch-target w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
          </div>

          <div>
            <label for="password2" class="block text-sm font-semibold text-slate-900 mb-1">Ulangi password</label>
            <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password"
                   placeholder="ketik ulang password"
                   class="touch-target w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
          </div>

          <button type="submit"
                  class="touch-target w-full px-4 py-3 bg-emerald-700 hover:bg-emerald-800 active:scale-[0.99] text-white text-sm font-semibold rounded-lg shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
            Daftar
          </button>
        </form>
      </div>

      <p class="text-center text-sm text-slate-600 mt-4">
        Sudah punya akun?
        <a href="/login" class="font-semibold text-emerald-700 hover:text-emerald-900 underline">Masuk di sini</a>
      </p>

    </div>
  </main>
</body>
</html>
